name: Update One Apex Dashboard

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set up Google Drive authentication
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: |
          echo "$GDRIVE_SERVICE_ACCOUNT" > gdrive_credentials.json
      
      - name: Download DPR from Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/download_dpr_from_drive.py
      
      - name: Extract dashboard data
        env:
          DPR_PASSWORD: ${{ secrets.DPR_PASSWORD }}
        run: |
          python scripts/extract_dashboard_data.py
      
      - name: Update dashboard HTML
        run: |
          python scripts/update_dashboard.py
      
      - name: Commit and push updated dashboard
        run: |
          git config --local user.email "dashboard-bot@oneapex.com"
          git config --local user.name "One Apex Dashboard Bot"
          git add index.html data/
          git diff --staged --quiet || git commit -m "Update dashboard $(date)"
          git push
      
      - name: Deployment status
        run: |
          echo "✅ Dashboard updated successfully!"
          echo "📊 Live at: https://ivanlontoc.github.io/oneapex-dashboard/"
